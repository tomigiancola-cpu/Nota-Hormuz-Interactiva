<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retorno estimado según TIR objetivo</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1a1a1a;
    --text-muted: #6b6b6b;
    --border: #e2e2e2;
    --surface: #f6f6f4;
    --accent-border: #b8b8b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  .chart-widget {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px;
  }
  .chart-widget h3 {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 16px;
  }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tabs button {
    font-size: 13px;
    font-family: inherit;
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  .tabs button:hover { background: var(--surface); }
  .tabs button.active {
    background: var(--surface);
    border-color: var(--accent-border);
    font-weight: 600;
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .slider-row label { font-size: 14px; color: var(--text-muted); white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; accent-color: #1a1a1a; }
  .slider-row .readout { font-size: 16px; font-weight: 600; min-width: 44px; text-align: right; }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .card {
    background: var(--surface);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .card .label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .card .value { font-size: 20px; font-weight: 600; }
  .chart-wrap { position: relative; width: 100%; }
  .source {
    font-size: 12px;
    color: var(--text-muted);
    margin: 10px 0 0;
  }
</style>
</head>
<body>
<div class="chart-widget">
  <h3>Retorno estimado según TIR objetivo</h3>

  <div class="tabs" id="grpBtns">
    <button data-g="bonares" class="active">Bonares</button>
    <button data-g="globales">Globales</button>
    <button data-g="bopreal">Bopreal</button>
  </div>

  <div class="slider-row">
    <label for="tirSlider">TIR objetivo</label>
    <input type="range" id="tirSlider" min="0" max="10" step="1" value="6">
    <span class="readout" id="tirOut">6%</span>
  </div>

  <div class="cards">
    <div class="card">
      <div class="label" id="lblBonares">Mejor Bonar (TIR 6%)</div>
      <div class="value" id="bestBonares">—</div>
    </div>
    <div class="card">
      <div class="label" id="lblGlobales">Mejor Global (TIR 6%)</div>
      <div class="value" id="bestGlobales">—</div>
    </div>
    <div class="card">
      <div class="label" id="lblBopreal">Mejor Bopreal (TIR 0%)</div>
      <div class="value" id="bestBopreal">—</div>
    </div>
  </div>

  <div class="chart-wrap" id="chartWrap" style="height:442px;">
    <canvas id="sensChart" role="img" aria-label="Gráfico de barras horizontales con el retorno de cada bono en la columna de TIR objetivo seleccionada">Retornos por bono según la tabla de sensibilidad.</canvas>
  </div>

  <p class="source">Fuente: Balanz en base a datos de mercado</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const GROUPS = {
  bonares: { cardLbl: "Bonar", min: 0, sel: 6, bonds: [
    {n:"AO27", v:[5.05,3.74,2.46,1.21,-0.01,-1.21,-2.38,-3.52,-4.65,-5.74,-6.82]},
    {n:"AL29", v:[10.90,9.00,7.15,5.36,3.63,1.95,0.31,-1.27,-2.81,-4.31,-5.76]},
    {n:"AL30", v:[17.90,15.31,12.81,10.41,8.09,5.85,3.70,1.61,-0.39,-2.34,-4.21]},
    {n:"AO28", v:[17.24,14.74,12.31,9.96,7.68,5.48,3.34,1.26,-0.75,-2.70,-4.60]},
    {n:"AN29", v:[28.78,24.85,21.09,17.48,14.02,10.70,7.51,4.45,1.50,-1.33,-4.05]},
    {n:"AE38", v:[58.76,50.00,41.94,34.52,27.67,21.34,15.49,10.06,5.02,0.34,-4.01]},
    {n:"AL35", v:[65.56,55.93,47.01,38.74,31.06,23.92,17.29,11.11,5.35,-0.02,-5.04]},
    {n:"AL41", v:[77.10,64.35,52.88,42.53,33.17,24.69,16.99,9.98,3.59,-2.25,-7.60]}
  ]},
  globales: { cardLbl: "Global", min: 0, sel: 6, bonds: [
    {n:"GD29", v:[9.88,8.00,6.17,4.40,2.68,1.01,-0.61,-2.18,-3.70,-5.19,-6.63]},
    {n:"GD30", v:[14.66,12.14,9.71,7.37,5.12,2.94,0.85,-1.18,-3.13,-5.02,-6.84]},
    {n:"GD38", v:[51.72,43.34,35.64,28.55,22.00,15.96,10.36,5.18,0.36,-4.11,-8.27]},
    {n:"GD35", v:[59.64,50.36,41.76,33.78,26.37,19.49,13.09,7.13,1.58,-3.60,-8.43]},
    {n:"GD41", v:[75.21,62.60,51.25,41.01,31.75,23.36,15.74,8.81,2.48,-3.30,-8.59]},
    {n:"GD46", v:[88.81,72.52,58.26,45.72,34.67,24.89,16.20,8.46,1.53,-4.68,-10.27]}
  ]},
  bopreal: { cardLbl: "Bopreal", min: -5, sel: 0, bonds: [
    {n:"BPOA7", v:[10.26,9.06,7.89,6.74,5.62,4.53,3.45,2.40,1.37,0.36,-0.63]},
    {n:"BPOB7", v:[9.88,8.69,7.52,6.38,5.26,4.17,3.10,2.05,1.02,0.01,-0.97]},
    {n:"BPOD7", v:[9.88,8.69,7.52,6.38,5.26,4.17,3.10,2.05,1.02,0.01,-0.97]},
    {n:"BPOC7", v:[9.50,8.32,7.15,6.01,4.90,3.81,2.74,1.70,0.67,-0.33,-1.31]},
    {n:"BPOB8", v:[31.29,28.23,25.29,22.44,19.68,17.01,14.43,11.94,9.52,7.17,4.91]},
    {n:"BPOA8", v:[29.69,26.68,23.76,20.95,18.23,15.59,13.04,10.58,8.19,5.87,3.63]}
  ]}
};

let curGroup = "bonares";
let chart = null;

function bestOf(gKey) {
  const g = GROUPS[gKey];
  const idx = g.sel - g.min;
  let best = g.bonds[0];
  g.bonds.forEach(b => { if (b.v[idx] > best.v[idx]) best = b; });
  return { n: best.n, r: best.v[idx], t: g.sel };
}

function updateCards() {
  [["bonares","bestBonares","lblBonares"],["globales","bestGlobales","lblGlobales"],["bopreal","bestBopreal","lblBopreal"]].forEach(([gKey, valId, lblId]) => {
    const b = bestOf(gKey);
    document.getElementById(valId).textContent = b.n + " " + (b.r >= 0 ? "+" : "") + b.r.toFixed(2) + "%";
    document.getElementById(lblId).textContent = "Mejor " + GROUPS[gKey].cardLbl + " (TIR " + b.t + "%)";
  });
}

function refresh() {
  const g = GROUPS[curGroup];
  const t = parseInt(document.getElementById("tirSlider").value, 10);
  g.sel = t;
  document.getElementById("tirOut").textContent = t + "%";
  const idx = t - g.min;
  chart.data.labels = g.bonds.map(b => b.n);
  chart.data.datasets[0].data = g.bonds.map(b => b.v[idx]);
  chart.data.datasets[0].backgroundColor = g.bonds.map(b => b.v[idx] >= 0 ? "#1baf7a" : "#e34948");
  chart.update("none");
  updateCards();
}

function setGroup(gKey) {
  curGroup = gKey;
  const g = GROUPS[gKey];
  const slider = document.getElementById("tirSlider");
  slider.min = g.min; slider.max = g.min + 10; slider.value = g.sel;
  document.getElementById("chartWrap").style.height = (g.bonds.length * 44 + 90) + "px";
  document.querySelectorAll("#grpBtns button").forEach(b => {
    b.classList.toggle("active", b.dataset.g === gKey);
  });
  refresh();
}

chart = new Chart(document.getElementById("sensChart"), {
  type: "bar",
  data: { labels: [], datasets: [{ label: "Retorno", data: [], backgroundColor: [], borderRadius: 4, maxBarThickness: 24 }] },
  options: {
    indexAxis: "y",
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: { callbacks: { label: ctx => "Retorno: " + (ctx.raw >= 0 ? "+" : "") + ctx.raw.toFixed(2) + "%" } }
    },
    scales: {
      x: { ticks: { color: "#6b6b6b", callback: v => (v > 0 ? "+" : "") + v + "%" }, grid: { color: "rgba(0,0,0,0.08)" } },
      y: { ticks: { color: "#6b6b6b", font: { weight: 600 } }, grid: { display: false } }
    }
  }
});

document.getElementById("tirSlider").addEventListener("input", refresh);
document.querySelectorAll("#grpBtns button").forEach(b => b.addEventListener("click", () => setGroup(b.dataset.g)));
setGroup("bonares");
</script>
</body>
</html>
